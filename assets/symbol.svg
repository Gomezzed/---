<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crouching Style symbol">
  <title>Crouching Style — Symbol</title>
  <defs>
    <!-- Top row: magenta -> pink (45deg) -->
    <linearGradient id="cs-top" gradientUnits="userSpaceOnUse"
                    x1="148" y1="156" x2="412" y2="248">
      <stop offset="0" stop-color="#E6007E"/>
      <stop offset="1" stop-color="#FF3CAC"/>
    </linearGradient>
    <!-- Bottom row: pink -> orange (45deg) -->
    <linearGradient id="cs-bot" gradientUnits="userSpaceOnUse"
                    x1="137" y1="280" x2="419" y2="360">
      <stop offset="0" stop-color="#FF6A88"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
  </defs>

  <!-- TOP: one wide, large slanted parallelogram (~22deg up-right) -->
  <polygon fill="url(#cs-top)" points="112,248 412,248 448,156 148,156"/>

  <!-- BOTTOM: two smaller parallelograms with a thin central gap -->
  <polygon fill="url(#cs-bot)" points="137,360 255,360 287,280 169,280"/>
  <polygon fill="url(#cs-bot)" points="269,360 387,360 419,280 301,280"/>
</svg>
