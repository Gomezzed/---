<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crouching Style symbol">
  <title>Crouching Style — Symbol</title>
  <defs>
    <!-- Brand gradient: 45deg, top-left to bottom-right -->
    <linearGradient id="cs-grad" gradientUnits="userSpaceOnUse"
                    x1="116" y1="192" x2="418" y2="374">
      <stop offset="0"    stop-color="#E6007E"/>
      <stop offset="0.34" stop-color="#FF3CAC"/>
      <stop offset="0.67" stop-color="#FF6A88"/>
      <stop offset="1"    stop-color="#FF8A00"/>
    </linearGradient>
  </defs>

  <!-- Three slanted parallelograms (sheared up-right):
       1 on top (apex), 2 on bottom (base) — reads as a rising
       upward arrow / diamond. One shared gradient flows across all. -->
  <g fill="url(#cs-grad)">
    <!-- Top (apex) -->
    <polygon points="204,278 324,278 370,192 250,192"/>
    <!-- Bottom-left -->
    <polygon points="116,374 236,374 282,288 162,288"/>
    <!-- Bottom-right -->
    <polygon points="252,374 372,374 418,288 298,288"/>
  </g>
</svg>
