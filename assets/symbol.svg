<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crouching Style symbol">
  <title>Crouching Style — Symbol</title>
  <defs>
    <!-- Top row: magenta -> pink (45deg, top-left to bottom-right) -->
    <linearGradient id="cs-top" gradientUnits="userSpaceOnUse"
                    x1="178" y1="156" x2="386" y2="252">
      <stop offset="0" stop-color="#E6007E"/>
      <stop offset="1" stop-color="#FF3CAC"/>
    </linearGradient>
    <!-- Bottom row: pink -> orange, continuous across both pieces -->
    <linearGradient id="cs-bot" gradientUnits="userSpaceOnUse"
                    x1="82" y1="270" x2="368" y2="356">
      <stop offset="0" stop-color="#FF6A88"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
  </defs>

  <!-- TOP: one wide, larger parallelogram, shifted right (rising right) -->
  <polygon fill="url(#cs-top)" points="136,252 386,252 428,156 178,156"/>

  <!-- BOTTOM: two smaller parallelograms; left juts out, thin slanted gap -->
  <polygon fill="url(#cs-bot)" points="82,356 198,356 236,270 120,270"/>
  <polygon fill="url(#cs-bot)" points="214,356 330,356 368,270 252,270"/>
</svg>
